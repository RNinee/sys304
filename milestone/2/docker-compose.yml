name: disaster-classifier

services:
  backend:
    build:
      context: ../..
      dockerfile: milestone/2/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      QWEN_ADAPTER_DIR: /models/qwen2.5-1.5b-disaster-lora
      PORT: "8000"
      HOST: 0.0.0.0
    volumes:
      - huggingface-cache:/cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  huggingface-cache:
