name: disaster-classifier-optimized

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: milestone/3/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      QWEN_ADAPTER_DIR: /models/qwen2.5-1.5b-disaster-lora
      PORT: "8000"
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: "3600"
      # CPU default: dynamic INT8 of merged Qwen. After distill+export, use onnx:
      # INFER_BACKEND: onnx
      INFER_BACKEND: int8
      INFER_WORKERS: "1"
      BATCH_MAX_SIZE: "8"
      BATCH_MAX_WAIT_MS: "15"
      STUDENT_DIR: /opt/models/distilbert-student
      ONNX_DIR: /opt/models/distilbert-student-onnx
    volumes:
      - huggingface-cache:/cache/huggingface
      - ./models:/opt/models:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s

  frontend:
    build:
      context: ../2/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  huggingface-cache:
